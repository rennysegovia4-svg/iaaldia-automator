name: IA al Día — Analytics Semanal

on:
  schedule:
    - cron: '0 12 * * 0'   # Domingos 8AM Chile
  workflow_dispatch:

jobs:
  analytics:
    name: "Reporte Analytics"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install google-genai google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Restaurar credenciales
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_JSON }}"          | base64 -d > token.json

      - name: Ejecutar Analytics
        run: python -W ignore analytics.py

      - name: Guardar token renovado
        if: always()
        run: |
          NEW_TOKEN=$(base64 -w 0 token.json 2>/dev/null || base64 token.json)
          echo "TOKEN_ACTUALIZADO=$NEW_TOKEN" >> $GITHUB_STEP_SUMMARY
