name: IA al Día — Publicación Automática

on:
  schedule:
    - cron: '0 15 * * *'   # 11AM Chile — Short ES (mejor horario según datos)
    - cron: '0 0 * * *'    # 8PM Chile  — Short ES (noche principal)
    - cron: '0 15 * * 1'   # 11AM Chile lunes — Video largo ES
    - cron: '0 14 * * *'   # 10AM Chile — Short EN (canal inglés)
    - cron: '0 20 * * *'   # 4PM Chile  — Short EN (canal inglés)
  workflow_dispatch:
    inputs:
      tipo:
        description: 'Tipo: short, largo, short_en'
        required: false
        default: 'short'
      viral_topic:
        description: 'Tema viral detectado (solo modo viral)'
        required: false
        default: ''
      viral_context:
        description: 'Contexto del tema viral'
        required: false
        default: ''
      viral_score:
        description: 'Score viral (0-100)'
        required: false
        default: '0'
      viral_niche:
        description: 'Nicho del tema viral'
        required: false
        default: ''

concurrency:
  group: publicar-short
  cancel-in-progress: false

jobs:
  # ── Canal Español (principal) ───────────────────────────────────────────────
  publicar_es:
    name: "Short ES"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 15 * * *' ||
        github.event.schedule == '0 0 * * *')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == 'short') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == '')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --fix-missing \
            ffmpeg fonts-dejavu-core \
            libcairo2-dev libpango1.0-dev \
            libglib2.0-dev pkg-config

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Restaurar credenciales ES
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_JSON }}"          | base64 -d > token.json

      - name: Restaurar .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          echo "ELEVENLABS_VOICE_PERIODISTA_URGENTE=onwK4e9ZLuTAKqWW03F9" >> .env
          echo "ELEVENLABS_VOICE_AMIGO_QUE_SABE=cjVigY5qzO86Huf0OWal" >> .env
          echo "ELEVENLABS_VOICE_PROVOCADOR=IKne3meq5aSn9XLyUdCD" >> .env
          echo "ELEVENLABS_VOICE_ANALISTA_FRIO=nPczCjzI2devNBz1zQrb" >> .env
          echo "ELEVENLABS_VOICE_STORYTELLER=JBFqnCBsd6RMkjVDRZzb" >> .env
          echo "ELEVENLABS_VOICE_COACH=TX3LPaxmHKxFdv7VOQHJ" >> .env
          echo "FORCE_PERSONA=provocador" >> .env

      - name: Publicar Short ES
        env:
          LANG_CODE: es
          VIRAL_TOPIC:             ${{ github.event.inputs.viral_topic }}
          VIRAL_CONTEXT:           ${{ github.event.inputs.viral_context }}
          VIRAL_SCORE:             ${{ github.event.inputs.viral_score }}
          VIRAL_NICHE:             ${{ github.event.inputs.viral_niche }}
          TIKTOK_ACCESS_TOKEN:     ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID:       ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN:  ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          output=$(python -W ignore generate_short.py 2>&1)
          echo "$output"
          echo "$output" > /tmp/short_output.txt

      - name: Notificar Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then exit 0; fi
          YT_URL=$(grep -oE 'https://youtube\.com/shorts/[a-zA-Z0-9_-]+' /tmp/short_output.txt 2>/dev/null | tail -1)
          TITULO=$(grep -oP '(?<=✓ ).*' /tmp/short_output.txt 2>/dev/null | grep -v 'http\|credito\|\$' | head -1)
          if [ -n "$YT_URL" ]; then
            MSG="🎬 Short publicado!%0A%0A${TITULO}%0A${YT_URL}"
            curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              -d "text=🎬 <b>Short publicado!</b>%0A%0A${YT_URL}"
          fi

      - name: Guardar token renovado ES
        if: always()
        run: |
          NEW_TOKEN=$(base64 -w 0 token.json 2>/dev/null || base64 token.json)
          echo "TOKEN_ES=$NEW_TOKEN" >> $GITHUB_STEP_SUMMARY

  # ── Video Largo (lunes) ─────────────────────────────────────────────────────
  publicar_largo:
    name: "Video Largo ES"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 15 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == 'largo')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --fix-missing \
            ffmpeg fonts-dejavu-core \
            libcairo2-dev libpango1.0-dev

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Restaurar credenciales
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_JSON }}"          | base64 -d > token.json

      - name: Restaurar .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env

      - name: Publicar Video Largo
        run: python -W ignore generate_long.py

      - name: Guardar token renovado
        if: always()
        run: |
          NEW_TOKEN=$(base64 -w 0 token.json 2>/dev/null || base64 token.json)
          echo "TOKEN_ACTUALIZADO=$NEW_TOKEN" >> $GITHUB_STEP_SUMMARY

  # ── Canal Inglés (clon) ─────────────────────────────────────────────────────
  publicar_en:
    name: "Short EN"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Solo corre si hay credenciales del canal EN configuradas
    if: >
      (github.event_name == 'schedule' &&
       (github.event.schedule == '0 14 * * *' ||
        github.event.schedule == '0 20 * * *')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tipo == 'short_en')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --fix-missing \
            ffmpeg fonts-dejavu-core \
            libcairo2-dev libpango1.0-dev

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Verificar credenciales EN
        id: check_en
        run: |
          if [ -z "${{ secrets.TOKEN_JSON_EN }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Canal EN no configurado — agrega TOKEN_JSON_EN y CLIENT_SECRETS_JSON_EN a GitHub Secrets"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Restaurar credenciales EN
        if: steps.check_en.outputs.skip == 'false'
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON_EN }}" | base64 -d > client_secrets_en.json
          echo "${{ secrets.TOKEN_JSON_EN }}"           | base64 -d > token_en.json

      - name: Restaurar .env
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
          echo "FORCE_PERSONA=provocador" >> .env

      - name: Publicar Short EN
        if: steps.check_en.outputs.skip == 'false'
        env:
          LANG_CODE: en
          TIKTOK_ACCESS_TOKEN:    ${{ secrets.TIKTOK_ACCESS_TOKEN_EN }}
          INSTAGRAM_USER_ID:      ${{ secrets.INSTAGRAM_USER_ID_EN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN_EN }}
        run: python -W ignore generate_short.py

      - name: Guardar token renovado EN
        if: steps.check_en.outputs.skip == 'false'
        run: |
          NEW_TOKEN=$(base64 -w 0 token_en.json 2>/dev/null || base64 token_en.json)
          echo "TOKEN_EN=$NEW_TOKEN" >> $GITHUB_STEP_SUMMARY
