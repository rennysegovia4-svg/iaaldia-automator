name: IA al Día — Learning Loop

on:
  schedule:
    - cron: '0 9 * * *'    # 5AM Chile — antes de publicar
    - cron: '0 20 * * *'   # 4PM Chile — después de publicar
  workflow_run:
    workflows: ["IA al Día — Publicación Automática"]
    types: [completed]
    # Solo correr si el workflow de publicación fue exitoso

  workflow_dispatch:

permissions:
  contents: write

jobs:
  aprender:
    name: "Ciclo de aprendizaje"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install google-genai google-auth google-auth-oauthlib \
                      google-auth-httplib2 google-api-python-client

      - name: Restaurar credenciales
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_JSON }}"          | base64 -d > token.json

      - name: Ejecutar Learning Loop
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -W ignore learning_loop.py

      - name: Ejecutar Viral Learner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -W ignore viral_learner.py
        continue-on-error: true

      - name: Commit y push memoria
        run: |
          git config user.name  "IA al Día Bot"
          git config user.email "bot@iaaldia.ai"
          git add memory.json strategy.json viral_patterns.json watchdog_log.json 2>/dev/null || true
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          ITER=$(python3 -c "import json; print(json.load(open('memory.json')).get('iteracion',0))" 2>/dev/null || echo "?")
          git commit -m "chore: learning loop iter $ITER"
          git pull --rebase origin main || (git rebase --abort; echo "rebase falló, reintentando merge"; git pull --no-rebase origin main)
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
