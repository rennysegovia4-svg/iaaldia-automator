name: IA al Día — Viral Learner

on:
  schedule:
    - cron: '0 10 * * *'   # 6AM Chile (UTC-4) todos los días
  workflow_dispatch:

jobs:
  aprender:
    name: "Aprender de virales"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install google-genai google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Restaurar credenciales
        run: |
          echo "${{ secrets.CLIENT_SECRETS_JSON }}" | base64 -d > client_secrets.json
          echo "${{ secrets.TOKEN_JSON }}"          | base64 -d > token.json

      - name: Ejecutar Viral Learner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -W ignore viral_learner.py

      - name: Commit patrones actualizados
        run: |
          git config user.name  "IA al Día Bot"
          git config user.email "bot@iaaldia.ai"
          git add viral_patterns.json
          git diff --cached --quiet || git commit -m "chore: viral patterns update $(date +%Y-%m-%d)"

      - name: Push patrones
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
